<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1528" />
    <link rel="icon" type="image/webp" href="../assets/images/cropped-logo1.webp" />
    <link rel="stylesheet" href="./cnn-conv1d.css" />
    <title>一维卷积 Conv1d 可视化 | 实验室</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="back-link" href="../index.html" aria-label="返回实验室主页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h14" /></svg>
          返回主页
        </a>
        <div class="title-group">
          <h1>一维卷积 · Conv1d</h1>
          <p>调整卷积层参数，观察局部窗口如何生成输出特征。</p>
        </div>
        <a class="docs-link" href="https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv1d.html" target="_blank" rel="noopener noreferrer">PyTorch 文档 ↗</a>
      </header>

      <main class="workspace">
        <aside class="settings-panel" aria-labelledby="settings-title">
          <h2 id="settings-title">参数设置</h2>
          <div class="parameter-grid">
            <label>输入长度 <span>L<sub>in</sub></span><input id="length" type="number" min="5" max="30" step="1" value="16" /></label>
            <label>输入通道 <span>C<sub>in</sub></span><input id="inChannels" type="number" min="1" max="8" step="1" value="2" /></label>
            <label>输出通道 <span>C<sub>out</sub></span><input id="outChannels" type="number" min="1" max="8" step="1" value="4" /></label>
            <label>卷积核大小 <span>K</span><input id="kernelSize" type="number" min="1" max="7" step="1" value="3" /></label>
            <label>步长 <span>stride</span><input id="stride" type="number" min="1" max="6" step="1" value="1" /></label>
            <label>空洞率 <span>dilation</span><input id="dilation" type="number" min="1" max="5" step="1" value="1" /></label>
            <label>分组 <span>groups</span><select id="groups"><option value="1">1</option></select></label>
            <label>填充规则 <span>padding</span><select id="paddingRule"><option value="custom">数值填充</option><option value="valid">valid</option><option value="same">same</option></select></label>
            <label id="padding-field">两侧填充量 <span>P</span><input id="padding" type="number" min="0" max="10" step="1" value="1" /></label>
            <label>填充模式 <span>padding_mode</span><select id="paddingMode"><option value="zeros">zeros · 补零</option><option value="reflect">reflect · 镜像</option><option value="replicate">replicate · 复制</option><option value="circular">circular · 循环</option></select></label>
          </div>
          <label class="bias-control"><input id="bias" type="checkbox" checked /><span class="switch"></span>使用偏置 <small>bias=True</small></label>

          <section class="shape-panel" aria-labelledby="shape-title">
            <h3 id="shape-title">输出形状</h3>
            <div class="formula">L<sub>out</sub> = ⌊(L<sub>in</sub> + P<sub>左</sub> + P<sub>右</sub> − D(K − 1) − 1) / S⌋ + 1</div>
            <p id="formula-values" class="formula-values"></p>
            <div id="shape-result" class="shape-result" aria-live="polite"></div>
            <p id="validation-message" class="validation-message" role="alert" hidden></p>
          </section>
          <p id="group-hint" class="group-hint">每组输入通道都会连接到对应组的输出通道。</p>
        </aside>

        <div class="lab-content">
          <div class="transport" aria-label="播放控制">
            <button id="play" class="button button-primary" type="button">▶ 播放</button>
            <button id="reset" class="button" type="button">↺ 重置</button>
            <button id="previous" class="button" type="button">← 上一步</button>
            <button id="next" class="button" type="button">下一步 →</button>
            <div class="step-control"><label for="step">步骤：<strong id="step-label">1 / 16</strong></label><input id="step" type="range" min="0" max="15" value="0" /></div>
            <label class="speed-control" for="speed">速度<select id="speed"><option value="1200">较慢</option><option value="800" selected>中等</option><option value="450">较快</option></select></label>
          </div>

          <section class="matrix-panel" aria-labelledby="input-title">
            <div class="panel-heading"><div><h2 id="input-title">输入序列 X</h2><p id="input-shape">形状：(1, 2, 16)</p></div><span id="padding-note">两侧填充 · zeros</span></div>
            <div class="matrix-scroll"><div id="input-grid" class="matrix-grid"></div></div>
          </section>

          <section class="matrix-panel kernel-panel" aria-labelledby="kernel-title">
            <div class="panel-heading"><div><h2 id="kernel-title">卷积核权重 W</h2><p id="kernel-shape">形状：(4, 2, 3)</p></div><label class="output-selector" for="selected-channel">查看输出通道 <select id="selected-channel"></select></label></div>
            <div class="kernel-layout">
              <div class="matrix-scroll"><div id="kernel-grid" class="matrix-grid"></div></div>
              <div class="bias-card"><span>偏置项 bias</span><strong id="bias-value">b[0] = 0.00</strong><small id="group-value">第 1 / 1 组</small></div>
            </div>
          </section>

          <section class="matrix-panel" aria-labelledby="output-title">
            <div class="panel-heading"><div><h2 id="output-title">输出序列 Y</h2><p id="output-shape">形状：(1, 4, 16)</p></div><span>琥珀色单元格为当前计算结果</span></div>
            <div class="matrix-scroll"><div id="output-grid" class="matrix-grid"></div></div>
          </section>

          <section class="calculation-panel" aria-labelledby="calculation-title">
            <h2 id="calculation-title">当前计算步骤 <span id="calculation-position"></span></h2>
            <div class="calculation-grid">
              <div><h3>参与计算的输入</h3><div id="input-terms" class="term-list"></div></div>
              <div><h3>加权求和</h3><p id="weighted-sum" class="calculation-text"></p></div>
              <div><h3>偏置与结果</h3><p id="bias-equation" class="calculation-text"></p><div id="final-result" class="final-result"></div></div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="./cnn-conv1d.js"></script>
  </body>
</html>
