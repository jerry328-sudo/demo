<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081525" />
    <link rel="icon" type="image/webp" href="../assets/images/cropped-logo1.webp" />
    <link rel="stylesheet" href="./brillouin_sampling.css" />
    <title>第一布里渊区采样 | 实验室</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="title-group">
          <h1>第一布里渊区采样</h1>
          <p>面心立方晶格 · 倒空间 k 点网格</p>
        </div>
        <a class="home-link" href="../index.html" aria-label="返回实验室主页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z" /></svg>
          返回实验室主页
        </a>
      </header>

      <main class="workspace">
        <section class="settings-panel" aria-labelledby="settings-title">
          <h2 id="settings-title">参数设置</h2>
          <div class="field">
            <label for="method">采样方式</label>
            <select id="method">
              <option value="monkhorst">Monkhorst–Pack</option>
              <option value="gamma">Γ 中心</option>
            </select>
          </div>

          <fieldset class="mesh-field">
            <legend>网格密度</legend>
            <div class="mesh-inputs">
              <label>N<sub>x</sub><input id="nx" type="number" min="1" max="16" step="1" value="6" inputmode="numeric" /></label>
              <label>N<sub>y</sub><input id="ny" type="number" min="1" max="16" step="1" value="6" inputmode="numeric" /></label>
              <label>N<sub>z</sub><input id="nz" type="number" min="1" max="16" step="1" value="6" inputmode="numeric" /></label>
            </div>
            <p class="field-hint">每个方向 1–16 个点</p>
          </fieldset>

          <div class="field">
            <label for="color">点颜色</label>
            <div class="color-control">
              <input id="color" type="color" value="#00dfff" />
              <output id="color-value" for="color">#00DFFF</output>
            </div>
          </div>

          <div class="field">
            <div class="field-heading"><label for="opacity">点透明度</label><output id="opacity-value" for="opacity">0.80</output></div>
            <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.8" />
          </div>

          <div class="actions">
            <button id="reset" class="button button-secondary" type="button">清空</button>
            <button id="regenerate" class="button button-primary" type="button">重新生成</button>
          </div>

          <div class="sample-summary" aria-live="polite">
            <span>总 k 点数</span>
            <strong id="counter">0</strong>
            <small id="grid-summary">6 × 6 × 6</small>
          </div>
        </section>

        <section class="visual-panel" aria-label="第一布里渊区三维可视化">
          <div id="visualization" class="visualization"></div>
          <div class="canvas-caption">拖动旋转 <span></span> 滚轮缩放 <span></span> 右键平移</div>
          <div class="legend" aria-label="图例">
            <div><i class="legend-gamma"></i>Γ 点 (0, 0, 0)</div>
            <div><i class="legend-sample"></i>采样 k 点</div>
            <div><i class="legend-boundary"></i>第一布里渊区边界</div>
          </div>
          <p id="error-message" class="error-message" role="alert" hidden></p>
        </section>
      </main>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.152.2/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./brillouin_sampling.js"></script>
  </body>
</html>
